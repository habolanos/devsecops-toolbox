metadata:
  name: "Deshabilitar Pipeline CD"
  version: "1.1"
  description: >
    Template para deshabilitar pipelines CD en Azure DevOps.
    Setea isDisabled=true via PUT: el pipeline permanece visible en la UI
    pero no permite crear nuevos releases. Es reversible: un PUT con
    isDisabled=false lo re-habilita. Se crea snapshot automatico para rollback.
  comment: "Pipeline deshabilitado via pipeline_updater - isDisabled=true"
  author: "Harold Adrian"
  created_at: "2026-07-31"

search:
  # El wildcard "*" coincide con cualquier stage.
  # Esto hace que el template aplique a TODOS los pipelines que tengan
  # al menos un environment/stage.
  #
  # Para filtrar por stages especificos, cambiar "*" por el nombre:
  # stages:
  #   - name: "Production"
  #
  # Para validar que el pipeline tenga EXACTAMENTE ciertos stages:
  # exact_match: true
  # stages:
  #   - name: "SCM Inspection"
  #   - name: "Develop"
  #   - name: "QA"
  #   - name: "Production"
  stages:
    - name: "*"

update:
  pipeline:
    action: "disable"

options:
  dry_run: false
  rollback_on_error: true
