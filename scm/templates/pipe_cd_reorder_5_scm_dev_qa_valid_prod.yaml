metadata:
  name: "Reordenar stages - Validación exacta"
  version: "1.0"
  description: "Reordenamiento: SCM Inspection → Develop → QA → Production → Validator"
  comment: |
    Reordenamiento de stages con validación exacta, Grupo T1

    IMPORTANTE: Este template SOLO actualiza pipelines que tengan
    EXACTAMENTE "SCM Inspection → Develop → QA → Production → Validator"

    Nuevo orden de ejecución:
    1. SCM Inspection
    2. Develop
    3. QA
    5. Validator
    6. Production

    Realizado por: Harold Adrian
    Fecha: 2026-07-24

search:
  # Validación exacta: Pipeline debe tener EXACTAMENTE estos 4 stages
  stages:
    - name: "SCM Inspection"
    - name: "Develop"
    - name: "QA"
    - name: "Validator"
    - name: "Production"

update:
  stages:
    # Nuevo orden: Build → Deploy → Test → Validate
    - name: "SCM Inspection"
      rank: 1
    - name: "Develop"
      rank: 2
    - name: "QA"
      rank: 3
    - name: "Validator"
      rank: 4
    - name: "Production"
      rank: 5
options:
  dry_run: false
  rollback_on_error: true
