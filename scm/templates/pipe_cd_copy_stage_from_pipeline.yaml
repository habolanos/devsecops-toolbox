metadata:
  name: "Copiar stage desde otro pipeline"
  version: "1.1"
  description: |
    Copia un stage desde un pipeline origen (source_definition_id) y lo
    inserta en el pipeline destino con un nuevo nombre. Permite:
    - Modificar atributos de las tasks del stage copiado (task_updates).
    - Sobrescribir el trigger del stage copiado (trigger).
    - Hacer que otros stages dependan del copiado (make_dependents).
  comment: |
    Copia cross-pipeline de stage con control de triggers y dependencias

    Comportamiento:
    1. Descarga el pipeline origen (source_definition_id).
    2. Extrae el stage fuente (source_stage).
    3. Sobrescribe el trigger del stage (opcional, campo trigger).
    4. Lo inserta en el pipeline destino con new_name.
    5. Aplica task_updates al stage copiado (opcional).
    6. Hace que otros stages dependan del copiado (opcional, make_dependents).
    7. Reasigna ranks consecutivamente.

    Opciones de trigger:
      after_release  -> Inicia automaticamente al crear el release.
      after_stage    -> Depende de reference_stage (o after_stage).
      none           -> Sin conditions (ejecucion manual).
      (omitido)      -> Hereda las conditions del stage origen.

    Ejemplo:
      Pipeline 2758 tiene stage "SCM Inspection".
      Pipeline 2760 no tiene ese stage.
      Se copia "SCM Inspection" de 2758 a 2760 al inicio del pipeline,
      con trigger after_release, y Develop/QA/Staging dependen de el.

    Realizado por: Harold Adrian
    Fecha: 2026-08-12

search:
  # El wildcard "*" coincide con cualquier stage.
  stages:
    - name: "*"

update:
  stages:
    - action: "copy_from"
      # Pipeline origen del cual copiar el stage
      source_definition_id: 2758
      # Nombre del stage a copiar en el pipeline origen
      source_stage: "SCM Inspection"
      # Nombre del nuevo stage en el pipeline destino
      new_name: "SCM Inspection"
      # Posicion: after | before | start | end (default: after)
      position: "start"
      # Trigger del stage copiado (opcional):
      #   after_release  -> inicia al crear el release
      #   after_stage    -> depende de reference_stage
      #   none           -> ejecucion manual
      #   (omitido)      -> hereda del stage origen
      trigger: "after_release"
      # Hacer que otros stages dependan del copiado (opcional):
      make_dependents:
        - stage: "Develop"
        - stage: "QA"
        - stage: "Staging"
      # Modificaciones de atributos de tasks dentro del stage copiado (opcional)
      task_updates:
        - task_name: "Deploy to QA"
          fields:
            - path: "inputs.namespace"
              new_value: "qa-copia"

options:
  dry_run: false
  rollback_on_error: true
