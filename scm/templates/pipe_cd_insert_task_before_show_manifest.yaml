metadata:
  name: "Insertar task antes de show Manifest"
  version: "1.0"
  description: "Inserta task script para consolidar env y remover datadog antes de show Manifest en todos los stages"
  comment: |
    Inserción de task script en stages existentes.

    Cambios realizados:
    1. Inserta task "Consolidar env y limpiar datadog" antes de la task "show Manifest"
    2. La task ejecuta un script bash que:
       - Consolida bloques env: del manifiesto k8s
       - Remueve anotaciones admission.datadoghq.com/enabled
    3. Aplica a todos los stages que contengan la task "show Manifest"

    Realizado por: Harold Adrian
    Fecha: 2026-08-04
  author: "Harold Adrian"
  created_at: "2026-08-04"

search:
  # Aplica a todos los pipelines que tengan al menos un stage
  stages:
    - name: "*"

update:
  tasks:
    - action: "add"
      before_task: "show Manifest"
      task:
        displayName: "clean Manifest"
        enabled: true
        alwaysRun: false
        continueOnError: false
        timeoutInMinutes: 5
        task:
          id: "6C731787-BC2C-4436-8290-A81493FFEA35"
          versionSpec: "3.*"
          definitionType: "task"
        inputs:
          filePath: "$(System.DefaultWorkingDirectory)/scm/templates/azdo-agrupar-env-task-add_secrets_manifest+remove_datadog_clean_manifest.sh"

options:
  dry_run: false
  rollback_on_error: true
