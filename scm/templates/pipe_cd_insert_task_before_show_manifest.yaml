metadata:
  name: "Insertar task antes de show Manifest"
  version: "1.0"
  description: "Inserta task script para consolidar env y remover datadog antes de show Manifest en todos los stages"
  comment: |
    Inserción de task script en stages existentes.

    Cambios realizados:
    1. Inserta task "Consolidar env y limpiar datadog" antes de la task "show Manifest"
    2. La task ejecuta un script bash que:
       - Consolida bloques env: del manifiesto k8s
       - Remueve anotaciones admission.datadoghq.com/enabled
    3. Aplica a todos los stages que contengan la task "show Manifest"

    Realizado por: Harold Adrian
    Fecha: 2026-08-04
  author: "Harold Adrian"
  created_at: "2026-08-04"

search:
  # Aplica a todos los pipelines que tengan al menos un stage
  stages:
    - name: "*"

update:
  tasks:
    - action: "add"
      before_task: "show Manifest"
      task:
        displayName: "clean Manifest"
        enabled: true
        alwaysRun: false
        continueOnError: false
        timeoutInMinutes: 5
        task:
          id: "6C731787-BC2C-4436-8290-A81493FFEA35"
          versionSpec: "3.*"
          definitionType: "task"
        inputs:
          script: |
            TARGET_FILE="$(System.ArtifactsDirectory)/$(sourcesArtifacts)/drop/k8s-manifest.yaml"
            PGM_FILE="$(System.ArtifactsDirectory)/$(sourcesArtifacts)/consolidar_env.py"

            if [ -f "$TARGET_FILE" ]; then
                echo "Procesando manifiesto en: $TARGET_FILE"

                cat > "$PGM_FILE" <<'PYEOF'
            import re, sys

            def remove_datadog_annotation(doc):
                lines = doc.splitlines(keepends=True)
                filtered = [
                    line for line in lines
                    if 'admission.datadoghq.com/enabled' not in line
                ]
                return "".join(filtered)

            def consolidar(doc):
                lines = doc.splitlines(keepends=True)
                blocks = []
                i = 0
                while i < len(lines):
                    m = re.match(r'^([ \t]*)env:[ \t]*$', lines[i])
                    if m:
                        indent = len(m.group(1))
                        start = i
                        i += 1
                        while i < len(lines) and (not lines[i].strip() or (len(lines[i]) - len(lines[i].lstrip())) > indent):
                            i += 1
                        blocks.append((start, i))
                    else:
                        i += 1

                if len(blocks) < 2:
                    return doc

                extra_vars = []
                for s, e in blocks[1:]:
                    extra_vars.extend(lines[s+1:e])

                for s, e in reversed(blocks[1:]):
                    del lines[s:e]

                first_end = blocks[0][1]
                lines[first_end:first_end] = extra_vars
                return "".join(lines)

            file_path = sys.argv[1]
            with open(file_path, 'r') as f:
                content = f.read()

            docs = re.split(r'(?m)(?=^---[ \t]*$)', content)
            new_content = "".join([consolidar(remove_datadog_annotation(d)) for d in docs])

            with open(file_path, 'w') as f:
                f.write(new_content)
            PYEOF

                python3 "$PGM_FILE" "$TARGET_FILE"
                rm "$PGM_FILE"
                echo "✅ Unificación de 'env:' y eliminación de 'admission.datadoghq.com/enabled' completadas exitosamente."
            else
                echo "⚠️ El archivo no existe en la ruta especificada."
            fi

options:
  dry_run: false
  rollback_on_error: true
