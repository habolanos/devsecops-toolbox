metadata:
  name: "Renovar Credenciales Git en Releases"
  version: "1.0"
  description: "Actualiza variables GIT_USER y GIT_PASS en releases existentes"
  comment: |
    Cambios: Renovacion trimestral de credenciales Git
    Razon: Rotacion de credenciales Q3 2026
    Aprobado por: DevOps Lead
    Fecha: 2026-08-27
  author: "DevOps Team"
  created_at: "2026-08-27"

release:
  ids: []  # Vacio: debe especificarse via --release-id o modo interactivo

update:
  global_vars:
    - name: "GIT_USER"
      value: "deploy-bot"
    - name: "GIT_PASS"
      value: "new-secret-token-2026"

  env_vars: []

  abandon: false

options:
  dry_run: true
  backup_path: "./outcome/backups"
