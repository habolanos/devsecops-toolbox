metadata:
  name: "Copiar stage desde otro pipeline"
  version: "1.2"
  description: |
    Copia un stage desde un pipeline origen (source_definition_id) y lo
    inserta en el pipeline destino con un nuevo nombre. Permite:
    - Modificar atributos de las tasks del stage copiado (task_updates).
    - Sobrescribir el trigger del stage copiado (trigger).
    - Hacer que otros stages dependan del copiado (make_dependents).
    - Agregar artifact filters con branches especificas (artifact_filters).
  comment: |
    Copia "SCM Inspection" del pipeline 3500 al inicio del pipeline destino.
    Trigger: after_release. Artifact filters: develop, QA, release/*.
    Develop, QA y Staging dependen del stage copiado.

    Realizado por: Harold Adrian
    Fecha: 2026-08-12

search:
  # El wildcard "*" coincide con cualquier stage.
  stages:
    - name: "*"

update:
  stages:
    - action: "copy_from"
      # Pipeline origen del cual copiar el stage
      source_definition_id: 3500
      # Nombre del stage a copiar en el pipeline origen
      source_stage: "SCM Inspection"
      # Nombre del nuevo stage en el pipeline destino
      new_name: "SCM Inspection"
      # Posicion: after | before | start | end (default: after)
      position: "start"
      # Trigger del stage copiado (opcional):
      #   after_release  -> inicia al crear el release
      #   after_stage    -> depende de reference_stage
      #   none           -> ejecucion manual
      #   (omitido)      -> hereda del stage origen
      trigger: "after_release"
      # Artifact filters del stage copiado (opcional):
      #   artifact: alias o token $auto / $auto:Git (default: $auto:Git)
      #   type: include | exclude (default: include)
      #   branches: lista de branches a filtrar
      artifact_filters:
        - artifact: "$auto:Git"
          type: "include"
          branches:
            - "develop"
            - "QA"
            - "release/*"
      # Hacer que otros stages dependan del copiado (opcional):
      make_dependents:
        - stage: "Develop"
        - stage: "QA"
        - stage: "Staging"

options:
  dry_run: false
  rollback_on_error: true
  ignore_variable_groups:
    all: [186, 196]
  # Reemplazar agent pools (queueId) inexistentes por IDs validos.
  # Agent Pool: queueId= 5331 para "gents-AutoScaling-Releases" 
  # Formato: old_id: new_id
  replace_agent_pools:
    1749: 5331
    1751: 5331
    2722: 5331
    7251: 5331