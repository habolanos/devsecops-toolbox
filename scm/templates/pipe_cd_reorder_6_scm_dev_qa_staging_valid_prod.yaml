metadata:
  name: "Reordenar stages - Validación exacta"
  version: "1.0"
  description: "Reordenamiento, Grupo T0, SCM Inspection → Develop → QA → Staging → Validador → Production"
  comment: |
    Reordenamiento de stages SCM Inspection → Develop → QA → Staging → Validator → Production

    Nuevo orden de ejecución:
    1. SCM Inspection
    2. Develop
    3. QA
    4. Staging
    5. Validator
    6. Production

    Realizado por: Harold Adrian
    Fecha: 2026-09-08

search:
  # Validación exacta: Pipeline debe tener EXACTAMENTE estos 6 stages
  exact_match: true
  stages:
    - name: "SCM Inspection"
    - name: "Develop"
    - name: "QA"
    - name: "Staging"
    - name: "Validator"
    - name: "Production"

update:
  stages:
    - name: "SCM Inspection"
      rank: 1
    
    - name: "Develop"
      rank: 2
    
    - name: "QA"
      rank: 3
    
    - name: "Staging"
      rank: 4

    - name: "Validator"
      rank: 5

    - name: "Production"
      rank: 6
options:
  dry_run: false
  rollback_on_error: true
