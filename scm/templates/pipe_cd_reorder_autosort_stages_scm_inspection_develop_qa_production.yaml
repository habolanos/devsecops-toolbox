metadata:
  name: "Auto-ordenar stages numericos alfanumerico"
  version: "1.0"
  description: |
    Reordena los stages fijos (SCM Inspection, Develop, QA, Production) segun el
    orden declarado en fixed_stages, y los stages numericos alfanumericamente.
    Todos los ranks se renumeran consecutivamente (1..N).
  comment: |
    Auto-ordenamiento de stages numericos + reorden de fijos

    Comportamiento:
    1. Los stages listados en fixed_stages se ordenan segun el orden declarado.
    2. Los stages que coinciden con sort_pattern se ordenan alfanumericamente.
    3. Los stages numericos se colocan despues de los stages fijos.
    4. Todos los ranks se renumeran consecutivamente (1..N).

    Ejemplo:
      Antes:  QA, Production, Develop, SCM Inspection, 03-Laguna, 01-Culiacan, 02-Leon
      Despues: SCM Inspection, Develop, QA, Production, 01-Culiacan, 02-Leon, 03-Laguna

    Realizado por: Harold Adrian
    Fecha: 2026-08-10

search:
  # El wildcard "*" coincide con cualquier stage.
  stages:
    - name: "*"

update:
  pipeline:
    action: "autosort_stages"
    # Stages fijos que se ordenan segun el rank declarado
    fixed_stages:
      - name: "SCM Inspection"
        rank: 1
      - name: "Develop"
        rank: 2
      - name: "QA"
        rank: 3
      - name: "Production"
        rank: 4
    # Patron regex para identificar stages a ordenar
    sort_pattern: "^\\d{2}-.*"
    # Orden: "asc" (alfanumerico ascendente) o "desc" (descendente)
    sort_order: "asc"

options:
  dry_run: false
  rollback_on_error: true
  ignore_variable_groups:
    all: [186, 196]
  replace_agent_pools:
    1749: 5331
    1751: 5331
    2722: 5331
    7251: 5331