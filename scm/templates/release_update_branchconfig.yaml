metadata:
  name: "Actualizar branchConfig y path_pipelineConfig en release"
  version: "1.2"
  description: "Busca branchConfig=config-cadenaSuministro en todos los stages y actualiza a feature/feature-amad. Ademas busca path_pipelineConfig en el script de la task 'get file k8-manifest' y lo reemplaza por path_pipelineConfigYml"
  comment: |
    Cambios:
    1. Variable branchConfig: config-cadenaSuministro → feature/feature-amad (todos los stages)
    2. Task "get file k8-manifest": path_pipelineConfig → path_pipelineConfigYml en inputs.script
    Razon: Promocion a feature branch y renombrado de variable de configuracion
    Aprobado por: DevOps Lead
    Fecha: 2026-08-27
  author: "DevOps Team"
  created_at: "2026-08-27"

search:
  stages:
    - name: "*"
  variables:
    - name: "branchConfig"
      value: "config-cadenaSuministro"

release:
  ids: []  # Vacio: debe especificarse via --release-id o modo interactivo

update:
  global_vars: []

  env_vars:
    - name: "branchConfig"
      value: "feature/feature-amad"

  tasks:
    - name: "get file k8-manifest"
      fields:
        - path: "inputs.script"
          old_value: "path_pipelineConfig"
          new_value: "path_pipelineConfigYml"

  abandon: false

options:
  dry_run: true
  backup_path: "./outcome/backups"
