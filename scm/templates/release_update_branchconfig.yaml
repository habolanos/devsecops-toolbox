metadata:
  name: "Actualizar branchConfig en todos los stages del release"
  version: "1.0"
  description: "Busca la variable branchConfig con valor config-cadenaSuministro en todos los stages y la actualiza a feature/feature-amad"
  comment: |
    Cambios: variable branchConfig config-cadenaSuministro → feature/feature-amad
    Razon: Promocion a feature branch
    Aprobado por: DevOps Lead
    Fecha: 2026-08-27
  author: "DevOps Team"
  created_at: "2026-08-27"

release:
  ids: []  # Vacio: debe especificarse via --release-id o modo interactivo

update:
  global_vars: []

  env_vars:
    - stage: "*"
      name: "branchConfig"
      search_value: "config-cadenaSuministro"
      value: "feature/feature-amad"

  abandon: false

  description: "Actualizacion branchConfig: config-cadenaSuministro → feature/feature-amad"

options:
  dry_run: true
  backup_path: "./outcome/backups"
