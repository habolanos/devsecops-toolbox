metadata:
  name: "Reordenar stages - Validación exacta"
  version: "1.0"
  description: "Reordenamiento, Grupo T11"
  comment: |
    Reordenamiento de stages con validación exacta, Grupo T1

    IMPORTANTE: Este template SOLO actualiza pipelines que tengan
    EXACTAMENTE "Develop → QA → Production → Staging → Validador"

    Nuevo orden de ejecución:
    1. Develop
    2. QA
    3. Staging
    4. Validador
    5. Production

    Realizado por: Harold Adrian
    Fecha: 2026-07-24

search:
  # Validación exacta: Pipeline debe tener EXACTAMENTE estos 4 stages
  exact_match: true
  stages:
    - name: "Develop"
    - name: "QA"
    - name: "Staging"
    - name: "Validador"
    - name: "Production"

update:
  stages:
    # Nuevo orden: Build → Deploy → Test → Validate
    - name: "Develop"
      rank: 1
    - name: "QA"
      rank: 2
    - name: "Staging"
      rank: 3
    - name: "Validador"
      rank: 4
    - name: "Production"
      rank: 5
options:
  dry_run: false
  rollback_on_error: true
