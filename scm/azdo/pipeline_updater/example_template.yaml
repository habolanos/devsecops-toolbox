metadata:
  name: "Docker Image Update"
  version: "1.0"
  description: "Actualiza la imagen Docker en todas las tareas de deploy"
  author: "DevOps Team"
  created_at: "2026-07-13"

search:
  stages:
    - "Producción"
    - "QA"
  tasks:
    - name: "Docker Push"
      type: "DockerPush"
    - name: "*Deploy*"
  variables:
    - "DOCKER_IMAGE"
    - "IMAGE_TAG"

update:
  tasks:
    - name: "Docker Push"
      fields:
        - path: "inputs.imageRepository"
          new_value: "myregistry.azurecr.io/myapp:latest"
        - path: "inputs.imageTag"
          new_value: "v2.0.0"
  variables:
    - name: "DOCKER_IMAGE"
      new_value: "myregistry.azurecr.io/myapp"
    - name: "IMAGE_TAG"
      new_value: "v2.0.0"

options:
  dry_run: false
  rollback_on_error: true
