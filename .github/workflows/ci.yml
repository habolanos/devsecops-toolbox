name: CI - DevSecOps Toolbox

on:
  push:
    branches: [master, main]
    paths:
      - 'scm/**/*.py'
      - '.github/workflows/ci.yml'
      - 'pyproject.toml'
  pull_request:
    branches: [master, main]
    paths:
      - 'scm/**/*.py'
      - '.github/workflows/ci.yml'
      - 'pyproject.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" black isort flake8

      - name: Check formatting (black)
        run: black --check --diff scm/
        continue-on-error: true

      - name: Check imports (isort)
        run: isort --check-only --diff scm/
        continue-on-error: true

      - name: Lint (flake8)
        run: flake8 scm/ --count --max-line-length=100 --extend-ignore=E203,W503 --statistics
        continue-on-error: true

      - name: Run tests
        run: pytest scm/tests/ -v --tb=short -m "not integration and not e2e" --cov=scm --cov-report=term
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
