name: CD - DevSecOps Toolbox Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., 1.7.20)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

  ci:
    name: Run CI
    needs: [validate]
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-exe:
    name: Build Windows Executable
    needs: [validate, ci]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Install dependencies
        run: pip install -e "."

      - name: Build executable
        run: python build_executables.py

      - name: Calculate SHA256
        shell: pwsh
        run: |
          $hash = Get-FileHash "dist/devsecops-toolbox.exe" -Algorithm SHA256
          $hash.Hash | Out-File dist/checksum_sha256.txt
          Write-Host "SHA256: $($hash.Hash)"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/devsecops-toolbox.exe
            dist/checksum_sha256.txt
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [validate, build-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          files: artifacts/windows-exe/*
          draft: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
